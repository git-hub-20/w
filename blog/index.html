<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Petr Vrána - Blog</title>

  <style>
    :root {
      --paper: #fbf7ef;
      --ink: #1c1c1c;
      --muted: rgba(28,28,28,.72);
      --hair: rgba(28,28,28,.18);
      --shadow: rgba(0,0,0,.12);
      --max: 800px;
      --pad: 20px;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      color: var(--ink);
      background: var(--paper);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Pozadí a dekorace */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.01), rgba(0,0,0,.01) 1px, transparent 1px, transparent 4px);
      z-index: 10;
    }

    header {
      max-width: var(--max);
      margin: 0 auto;
      padding: 40px var(--pad) 20px;
    }

    .mast {
      border: 1px solid var(--hair);
      border-radius: var(--radius);
      padding: 24px;
      background: rgba(255,255,255,.4);
      box-shadow: 0 8px 20px var(--shadow);
    }

    .mast h1 { margin: 0; font-size: 24px; letter-spacing: -0.5px; }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 var(--pad) 80px;
    }

    .controls {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    select {
      font: inherit;
      padding: 4px 8px;
      border: 1px solid var(--hair);
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .item {
      border: 1px solid var(--hair);
      border-radius: var(--radius);
      background: rgba(255,255,255,.3);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .item:hover {
      box-shadow: 0 4px 12px var(--shadow);
      transform: translateY(-1px);
    }

    .item button {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 20px;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .no { font-weight: 800; opacity: 0.4; min-width: 25px; }
    .title { font-weight: 700; font-size: 18px; }
    .perex { margin: 0; font-size: 14px; color: var(--muted); }

    /* Dialog (Detail článku) */
    dialog {
      width: min(760px, calc(100vw - 30px));
      border: 1px solid var(--hair);
      border-radius: 16px;
      padding: 0;
      background: var(--paper);
      box-shadow: 0 30px 60px rgba(0,0,0,.3);
    }

    dialog::backdrop { background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); }

    .dlg-content { padding: 30px; position: relative; }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      border: 1px solid var(--hair);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    #dlgDate { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    #dlgTitle { margin: 0 0 20px; font-size: 28px; line-height: 1.2; }

    .article-body {
      border-top: 1px dashed var(--hair);
      padding-top: 20px;
      line-height: 1.8;
      font-size: 16px;
    }

    .article-body p { margin-bottom: 1.5em; }

    /* Loading state */
    #status-msg { padding: 20px; text-align: center; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<header>
  <div class="mast">
    <h1>Petr Vrána - blog</h1>
  </div>
</header>

<main>
  <div class="controls">
    <label for="sort">Řadit podle:</label>
    <select id="sort">
      <option value="newest">nejnovější</option>
      <option value="oldest">nejstarší</option>
    </select>
  </div>

  <div id="status-msg">Hledám články...</div>
  <section class="list" id="list"></section>
</main>

<dialog id="articleDialog">
  <div class="dlg-content">
    <button class="close-btn" id="dlgClose">Zavřít [esc]</button>
    <time id="dlgDate"></time>
    <h2 id="dlgTitle"></h2>
    <div class="article-body" id="dlgBody"></div>
  </div>
</dialog>

<script>
  // Konfigurace
  const MAX_POSTS = 20; // Kolik souborů (1.html až 20.html) se má zkusit načíst
  const FOLDER = 'post'; // Název složky se soubory

  const listEl = document.getElementById("list");
  const sortSelect = document.getElementById("sort");
  const statusEl = document.getElementById("status-msg");
  
  const dlg = document.getElementById("articleDialog");
  const dlgTitle = document.getElementById("dlgTitle");
  const dlgDate = document.getElementById("dlgDate");
  const dlgBody = document.getElementById("dlgBody");
  const dlgClose = document.getElementById("dlgClose");

  let articlesData = [];

  // Hlavní funkce pro načtení článků
  async function loadArticles() {
    const parser = new DOMParser();
    const fetchPromises = [];

    // Paralelní spuštění všech fetch požadavků najednou
    for (let i = 1; i <= MAX_POSTS; i++) {
      fetchPromises.push(
        fetch(`${FOLDER}/${i}.html`)
          .then(async res => {
            // Kontrola existence souboru a typu obsahu (důležité pro Cloudflare/GitHub)
            const contentType = res.headers.get("content-type");
            if (!res.ok || !contentType || !contentType.includes("text/html")) return null;
            
            const text = await res.text();
            const doc = parser.parseFromString(text, 'text/html');
            
            // Validace metadat v souboru
            const titleEl = doc.querySelector('.post-title');
            const dateEl = doc.querySelector('.post-date');
            
            if (!titleEl || !dateEl) return null;

            const rawDate = dateEl.getAttribute('content');
            if (!rawDate) return null;

            return {
              id: i,
              title: titleEl.textContent.trim(),
              date: rawDate,
              formattedDate: new Date(rawDate).toLocaleDateString('cs-CZ', { 
                year: 'numeric', month: 'long', day: 'numeric' 
              }),
              perex: doc.querySelector('.post-perex')?.textContent.trim() || '',
              content: doc.querySelector('.post-content')?.innerHTML || ''
            };
          })
          .catch(() => null)
      );
    }

    const results = await Promise.all(fetchPromises);
    
    // Odfiltrování prázdných/neexistujících výsledků
    articlesData = results.filter(a => a !== null);
    
    statusEl.style.display = "none";
    renderList();
  }

  // Vykreslení seznamu článků
  function renderList() {
    listEl.innerHTML = "";
    
    if (articlesData.length === 0) {
      statusEl.textContent = "Zatím tu nejsou žádné články.";
      statusEl.style.display = "block";
      return;
    }

    const sorted = [...articlesData].sort((a, b) => {
      const da = new Date(a.date), db = new Date(b.date);
      return sortSelect.value === "newest" ? db - da : da - db;
    });

    sorted.forEach(a => {
      const item = document.createElement("article");
      item.className = "item";
      item.innerHTML = `
        <button>
          <div class="row">
            <span class="no">${String(a.id).padStart(2, '0')}</span>
            <span class="title">${a.title}</span>
          </div>
          <p class="perex">${a.perex}</p>
        </button>
      `;
      
      item.querySelector('button').onclick = () => {
        dlgTitle.textContent = a.title;
        dlgDate.textContent = a.formattedDate;
        dlgBody.innerHTML = a.content;
        dlg.showModal();
      };
      
      listEl.appendChild(item);
    });
  }

  // Události
  dlgClose.onclick = () => dlg.close();
  sortSelect.onchange = renderList;

  // Spuštění
  loadArticles();
</script>

</body>
</html>
