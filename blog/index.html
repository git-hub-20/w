<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Články</title>
  <style>
    :root{ --paper:#fbf7ef; --ink:#1c1c1c; --muted: rgba(28,28,28,.72); --hair: rgba(28,28,28,.18); --shadow: rgba(0,0,0,.18); --max: 900px; --pad: 22px; --radius: 10px; }
    *{ box-sizing:border-box; }
    body{ margin:0; color:var(--ink); background: var(--paper); font-family: ui-monospace, monospace; -webkit-font-smoothing: antialiased; }
    header{ max-width:var(--max); margin:0 auto; padding: 38px var(--pad) 18px; }
    .mast{ border:1px solid var(--hair); border-radius: var(--radius); padding: 18px; box-shadow: 0 12px 30px var(--shadow); background: rgba(255,255,255,.35); }
    main{ max-width:var(--max); margin:0 auto; padding: 0 var(--pad) 60px; }
    .controls{ margin: 0 0 18px; font-size:13px; }
    .list{ display:flex; flex-direction:column; gap:12px; }
    .item{ border:1px solid var(--hair); border-radius: var(--radius); background: rgba(255,255,255,.25); }
    .item button{ width:100%; text-align:left; border:0; background:transparent; padding:16px; cursor:pointer; font:inherit; color:inherit; }
    .row{ display:flex; gap:14px; align-items:baseline; }
    .no{ font-weight:700; }
    .title{ font-weight:700; }
    .perex{ margin:10px 0 0; font-size:14px; color:var(--muted); }
    dialog{ width: min(860px, calc(100vw - 28px)); border:1px solid var(--hair); border-radius:12px; padding:0; background:var(--paper); }
    .dlg{ padding:18px; position:relative; }
    .dlg-date{ font-size:12px; color:var(--muted); margin-bottom:8px; display:block; }
    .body{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--hair); line-height:1.75; }
    .close{ position:absolute; top:12px; right:12px; cursor:pointer; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--hair); background: white; }
  </style>
</head>
<body>

<header>
  <div class="mast">
    <h1>Petr Vrána - blog</h1>
  </div>
</header>

<main>
  <div class="controls">
    <select id="sort">
      <option value="newest">nejnovější</option>
      <option value="oldest">nejstarší</option>
    </select>
  </div>
  <section class="list" id="list"></section>
</main>

<dialog id="articleDialog">
  <div class="dlg">
    <button class="close" id="dlgClose">Zavřít</button>
    <time class="dlg-date" id="dlgDate"></time>
    <h2 id="dlgTitle" style="margin-top:0;"></h2>
    <div class="body" id="dlgBody"></div>
  </div>
</dialog>

<script>
  const MAX_POSTS = 20; 
  const listEl = document.getElementById("list");
  const sortSelect = document.getElementById("sort");
  const dlg = document.getElementById("articleDialog");
  const dlgTitle = document.getElementById("dlgTitle");
  const dlgDate = document.getElementById("dlgDate");
  const dlgBody = document.getElementById("dlgBody");
  const dlgClose = document.getElementById("dlgClose");

  let articlesData = [];

  async function loadArticles() {
    articlesData = [];
    const parser = new DOMParser();

    for (let i = 1; i <= MAX_POSTS; i++) {
      try {
        const res = await fetch(`post/${i}.html`);
        if (!res.ok) continue; // Pokud soubor neexistuje, přeskočí se
        
        const text = await res.text();
        const doc = parser.parseFromString(text, 'text/html');
        
        const rawDate = doc.querySelector('.post-date')?.getAttribute('content') || '2000-01-01';
        
        articlesData.push({
          id: i,
          title: doc.querySelector('.post-title')?.textContent || `Článek ${i}`,
          date: rawDate,
          formattedDate: new Date(rawDate).toLocaleDateString('cs-CZ'),
          perex: doc.querySelector('.post-perex')?.textContent || '',
          content: doc.querySelector('.post-content')?.innerHTML || ''
        });
      } catch (e) {
        // Chyba fetch/parsování - článek nebude přidán do pole
      }
    }
    renderList();
  }

  function renderList() {
    listEl.innerHTML = "";
    if (articlesData.length === 0) {
      listEl.textContent = "Žádné články k zobrazení.";
      return;
    }

    const sorted = [...articlesData].sort((a, b) => {
      const da = new Date(a.date), db = new Date(b.date);
      return sortSelect.value === "newest" ? db - da : da - db;
    });

    sorted.forEach(a => {
      const art = document.createElement("article");
      art.className = "item";
      art.innerHTML = `<button>
        <div class="row"><span class="no">${String(a.id).padStart(2,'0')}</span><span class="title">${a.title}</span></div>
        <p class="perex">${a.perex}</p>
      </button>`;
      art.querySelector('button').onclick = () => {
        dlgTitle.textContent = a.title;
        dlgDate.textContent = a.formattedDate;
        dlgBody.innerHTML = a.content;
        dlg.showModal();
      };
      listEl.appendChild(art);
    });
  }

  dlgClose.onclick = () => dlg.close();
  sortSelect.onchange = renderList;
  loadArticles();
</script>
</body>
</html>
