<body>
  <h1 class="post-title">A nic nemám</h1>

  <p class="post-perex">Příliš daleko, nedosáhnu tam</p>

  <div class="post-content">
    <p style="text-align: center;">Příliš daleko</p>
    <p style="text-align: center;">nedosáhnu tam</p>
    <p style="text-align: center;">možná poznání</p>
    <p style="text-align: center;">jen pouhý je klam</p>
    <p style="text-align: center;">---</p>
    <p style="text-align: center;">Přikován v jezkyni</p>
    <p style="text-align: center;">ovšem bez okovů</p>
    <p style="text-align: center;">vylézt nemožné</p>
    <p style="text-align: center;">věřte tomu</p>
    <p style="text-align: center;">---</p>
    <p style="text-align: center;">Avšak stačilo se dívat dál</p>
    <p style="text-align: center;">abych neviděl, co blízko mám</p>
    <p style="text-align: center;">teď dívám se dál, nedoostřuji</p>
    <p style="text-align: center;">a nic nemám</p>
    
  </div>
